<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PagoYa - Nueva transferencia</title>
  <link rel="stylesheet" href="../../css/style.css">
  <script type="module" src="../../js/transfer/transfer.js"></script>
</head>
<body class="app-body">

  <!-- responsive design: menu hamburguesa (visible solo en movil) -->
  <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden>
  <label for="nav-toggle" class="nav-toggle-btn">☰</label>

  <aside class="sidebar">
    <div class="brand">Pago<span>Ya</span></div>
    <nav>
      <div class="nav-section">
        <span class="nav-section-title">Principal</span>
        <a href="../dashboard/dashboard.html" class="nav-link">Inicio</a>
      </div>
      <div class="nav-section">
        <span class="nav-section-title">Operaciones</span>
        <a href="../account/list.html" class="nav-link">Cuentas</a>
        <a href="list.html" class="nav-link active">Transferencias</a>
      </div>
      <div class="nav-section">
        <span class="nav-section-title">Analisis</span>
        <a href="../reports/reports.html" class="nav-link">Reportes</a>
        <a href="../assistant/assistant.html" class="nav-link">Asistente IA</a>
      </div>
      <div class="nav-section">
        <span class="nav-section-title">Cuenta</span>
        <a href="../profile/profile.html" class="nav-link">Perfil</a>
        <a href="../../index.html" class="nav-link">Cerrar sesion</a>
      </div>
    </nav>
  </aside>

  <div class="layout">

    <header class="topbar">
      <span class="crumb">Operaciones / Transferencias / Nueva</span>
      <div class="user">
        <span>Henry Antonio Mendoza Puerta</span>
        <span class="avatar">HAMP</span>
      </div>
    </header>

    <main>

      <div class="page-head">
        <h1 class="page-title">Nueva transferencia</h1>
        <p class="page-subtitle">Indica origen, destino y monto a transferir.</p>
      </div>

      <section class="panel panel-narrow">
        <form>
          <p class="form-mensaje" hidden></p>
          <div class="form-grid">
            <div>
              <label for="origen">Cuenta de origen</label>
              <select id="origen" required>
                <option value="">Seleccionar...</option>
                <option>1234-5678-9012-3456 (Ahorro)</option>
                <option>9876-5432-1098-7654 (Corriente)</option>
              </select>
            </div>
            <div>
              <label for="destino">Cuenta de destino</label>
              <input type="text" id="destino" placeholder="0000-0000-0000-0000" required>
            </div>
            <div>
              <label for="monto">Monto</label>
              <input type="number" id="monto" placeholder="0.00" min="0.01" step="0.01" required>
            </div>
            <div>
              <label for="moneda">Moneda</label>
              <select id="moneda">
                <option>ARS</option>
                <option>USD</option>
              </select>
            </div>
            <div class="full">
              <label for="concepto">Concepto</label>
              <input type="text" id="concepto" placeholder="Motivo de la transferencia">
            </div>
          </div>

          <div class="form-actions">
            <a href="list.html" class="btn btn-secundario">Cancelar</a>
            <button type="submit" class="btn">Transferir</button>
          </div>
        </form>
      </section>

    </main>

    <footer>© 2026 PagoYa</footer>

  </div>

</body>
</html>
