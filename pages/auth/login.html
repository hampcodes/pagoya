<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PagoYa - Iniciar sesion</title>
  <link rel="stylesheet" href="../../css/style.css">
  <script type="module" src="../../js/auth/login.js"></script>
</head>
<body class="auth-body">

  <aside class="auth-side">
    <a href="../../index.html" class="auth-side-logo">Pago<span>Ya</span></a>
    <p class="auth-side-text">
      Tu plataforma de pagos, simple y al instante.
      Envia, administra y controla tu dinero en un solo lugar.
    </p>
  </aside>

  <main class="auth-main">
    <div class="auth-card">
      <form action="../dashboard/dashboard.html" method="get">
        <h2>Iniciar sesion</h2>
        <p class="subtitulo">Ingresa con tu correo y contrasena.</p>

        <p class="form-mensaje" hidden></p>

        <label for="email">Correo</label>
        <input type="email" id="email" placeholder="tu@correo.com" required>

        <label for="password">Contrasena</label>
        <input type="password" id="password" placeholder="••••••••" required>

        <div class="form-actions">
          <button type="submit" class="btn btn-block">Entrar</button>
        </div>

        <p class="form-foot">
          No tenes cuenta? <a href="register.html">Crear cuenta</a>
        </p>
      </form>
    </div>
  </main>

</body>
</html>
