<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PagoYa - Asistente IA</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="app-body">

  <!-- responsive design: menu hamburguesa (visible solo en movil) -->
  <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden>
  <label for="nav-toggle" class="nav-toggle-btn">☰</label>

  <aside class="sidebar">
    <div class="brand">Pago<span>Ya</span></div>
    <nav>
      <div class="nav-section">
        <span class="nav-section-title">Principal</span>
        <a href="../dashboard/dashboard.html" class="nav-link">Inicio</a>
      </div>
      <div class="nav-section">
        <span class="nav-section-title">Operaciones</span>
        <a href="../account/list.html" class="nav-link">Cuentas</a>
        <a href="../transfer/list.html" class="nav-link">Transferencias</a>
      </div>
      <div class="nav-section">
        <span class="nav-section-title">Analisis</span>
        <a href="../reports/reports.html" class="nav-link">Reportes</a>
        <a href="assistant.html" class="nav-link active">Asistente IA</a>
      </div>
      <div class="nav-section">
        <span class="nav-section-title">Cuenta</span>
        <a href="../profile/profile.html" class="nav-link">Perfil</a>
        <a href="../../index.html" class="nav-link">Cerrar sesion</a>
      </div>
    </nav>
  </aside>

  <div class="layout">

    <header class="topbar">
      <span class="crumb">Analisis / Asistente IA</span>
      <div class="user">
        <span>Henry Antonio Mendoza Puerta</span>
        <span class="avatar">HAMP</span>
      </div>
    </header>

    <main>

      <div class="page-head">
        <h1 class="page-title">Asistente IA</h1>
        <p class="page-subtitle">Genera texto e imagenes con OpenAI.</p>
      </div>

      <section class="panel panel-narrow">
        <!-- Sin backend, cada persona usa SU propia API key (se guarda solo
             en este navegador). En un sitio real iria en un servidor. -->
        <label for="apiKey">API key de OpenAI</label>
        <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">

        <!-- Aqui se van acumulando los mensajes y las imagenes. -->
        <div id="chat" class="chat"></div>

        <form id="formChat">
          <div class="form-mensaje" hidden></div>
          <textarea id="pregunta" rows="2" placeholder="Escribe un mensaje o describe una imagen..."></textarea>

          <div class="form-actions">
            <button type="submit" class="btn">Enviar texto</button>
            <button type="button" id="btnImagen" class="btn btn-secundario">Generar imagen</button>
          </div>
        </form>
      </section>

    </main>

    <footer>© 2026 PagoYa</footer>

  </div>

  <script type="module" src="../../js/assistant/assistant.js"></script>

</body>
</html>
